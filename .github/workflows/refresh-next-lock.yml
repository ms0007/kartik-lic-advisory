name: Refresh patched Next.js lockfile

on:
  push:
    branches:
      - codename-audit/admin-secret-hardening-2026-10-25

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile from patched Next.js
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify reproducible installation
        run: npm ci --ignore-scripts --no-audit
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh lockfile for patched Next.js"
          git push
